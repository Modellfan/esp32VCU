; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; SPIFFS image = built PWA (python pwa/tools/build.py).
data_dir = pwa/dist

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = spiffs
; build date for the serial command "version" (src/services/serial_console.cpp)
extra_scripts = pre:tools/pio_build_info.py
build_flags =
	; firmware identity (serial command "version", printed at start-up)
	-DAPP_NAME=\"eBoxster-VCU\"
	-DAPP_VERSION=\"0.1.0\"
	-DPIO_ENV_NAME=\"${PIOENV}\"
	; text log on UART0 (COM10) while GVRET is not in binary mode (VCU-DEC-010)
	-D VCU_LOG_ENABLED=1
	; src/ folders (see src/main.cpp): includes stay plain "name.h"
	-I src/app
	-I src/comms
	-I src/drivers
	-I src/services
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_port = COM10
monitor_port = COM10

lib_deps = 
	https://github.com/Modellfan/ACAN2515
	FastLED/FastLED@^3.9.15
	handmade0octopus/ESP32-TWAI-CAN@^1.0.1


	;https://github.com/Modellfan/acan-esp32
	;https://github.com/Modellfan/esp32_can
	;https://github.com/collin80/can_common


