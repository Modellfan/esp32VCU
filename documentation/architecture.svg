<g class="mod"><rect x="180" y="222" width="275" height="50" rx="8"/><text class="h" x="317" y="239">Codecs (COM)</text><text class="s" x="317" y="257">986, SDU, Batterie (geplant)</text></g>

<g class="mod"><rect x="35" y="312" width="130" height="50" rx="8"/><text class="h" x="100" y="329">Aktor-Treiber</text><text class="s" x="100" y="347">Lüfter, Poti, LED</text></g>
<g class="mod"><rect x="325" y="312" width="130" height="50" rx="8"/><text class="h" x="390" y="329">CAN-Treiber</text><text class="s" x="390" y="347">ACAN2515, SPI</text></g>

<g class="hw"><rect x="35" y="402" width="130" height="50" rx="8"/><text class="h" x="100" y="419">GPIO, X9C103S</text><text class="s" x="100" y="437">Relais, Poti, LED</text></g>
<g class="hw"><rect x="325" y="402" width="130" height="50" rx="8"/><text class="h" x="390" y="419">2× MCP2515</text><text class="s" x="390" y="437">CAN0: TWAI (GPIO21/20)</text></g>
<g class="hw"><rect x="505" y="402" width="140" height="50" rx="8"/><text class="h" x="575" y="419">WLAN, USB</text><text class="s" x="575" y="437">Funk, UART</text></g>

<g class="mod"><rect x="505" y="42" width="140" height="50" rx="8"/><text class="h" x="575" y="59">CAN-Task</text><text class="s" x="575" y="77">6 ms, Kern 1</text></g>
<g class="mod"><rect x="505" y="132" width="140" height="50" rx="8"/><text class="h" x="575" y="149">Webserver</text><text class="s" x="575" y="167">API, PWA, Kern 0</text></g>
<g class="mod"><rect x="505" y="222" width="140" height="50" rx="8"/><text class="h" x="575" y="239">SPIFFS</text><text class="s" x="575" y="257">PWA (pwa/dist)</text></g>
<g class="mod"><rect x="505" y="312" width="140" height="50" rx="8"/><text class="h" x="575" y="329">GVRET</text><text class="s" x="575" y="347">Queue → UART0</text></g>

<g class="ext"><rect x="35" y="482" width="130" height="50" rx="8"/><text class="h" x="100" y="499">Aktoren</text><text class="s" x="100" y="517">Lüfter, Tank</text></g>
<g class="ext"><rect x="325" y="482" width="130" height="50" rx="8"/><text class="h" x="390" y="499">CAN-Busse</text><text class="s" x="390" y="517">Fzg., SDU, BMS</text></g>
<g class="ext"><rect x="505" y="482" width="140" height="50" rx="8"/><text class="h" x="575" y="499">Navi, PC</text><text class="s" x="575" y="517">Display, SavvyCAN</text></g>

