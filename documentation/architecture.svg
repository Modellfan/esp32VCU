<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
<title>Architektur esp32VCU – Ebenenmodell</title>
<desc>Ebenen nach AUTOSAR-Prinzip: Anwendung (Kombi-Rechnung), Daten (params), Kommunikation (Codecs), Treiber (CAN, Aktoren), Hardware; Dienste (Scheduler, Webserver, SPIFFS, GVRET) als eigene Spalte. Stand nach Umbau 2026-10-28.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;dominant-baseline:central;text-anchor:middle}
.h{font-size:14px;font-weight:600}.s{font-size:12px}
.bl{font-size:12px;fill:#5F5E5A;text-anchor:start;font-weight:600}
.band{fill:#F7F6F2;stroke:#B4B2A9;stroke-width:0.8}
.ext rect{fill:#E1F5EE;stroke:#0F6E56}.ext .h{fill:#085041}.ext .s{fill:#0F6E56}
.mod rect{fill:#EEEDFE;stroke:#534AB7}.mod .h{fill:#3C3489}.mod .s{fill:#534AB7}
.mem rect{fill:#FAEEDA;stroke:#854F0B}.mem .h{fill:#633806}.mem .s{fill:#854F0B}
.hw rect{fill:#F1EFE8;stroke:#5F5E5A}.hw .h{fill:#444441}.hw .s{fill:#5F5E5A}
.plan rect{fill:#FFFFFF;stroke:#5F5E5A;stroke-dasharray:4 3}.plan .h{fill:#444441}.plan .s{fill:#5F5E5A}
rect{stroke-width:0.8}
.a{stroke:#5F5E5A;stroke-width:1.5;fill:none}.d{stroke-dasharray:4 3}
.l{font-size:12px;fill:#444441;text-anchor:start}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="580" fill="#FFFFFF" stroke="none"/>

<rect class="band" x="20" y="20" width="455" height="80" rx="10"/><text class="bl" x="32" y="31">Anwendung · High Level</text>
<rect class="band" x="20" y="110" width="455" height="80" rx="10"/><text class="bl" x="32" y="121">Daten · RTE</text>
<rect class="band" x="20" y="200" width="455" height="80" rx="10"/><text class="bl" x="32" y="211">Kommunikation</text>
