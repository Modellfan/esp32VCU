<rect class="band" x="490" y="20" width="170" height="350" rx="10"/><text class="bl" x="502" y="31">Dienste</text>

<g class="mod"><rect x="35" y="42" width="130" height="50" rx="8"/><text class="h" x="100" y="59">Lüfterlogik</text><text class="s" x="100" y="77">Hand + Automatik</text></g>
<g class="mod"><rect x="180" y="42" width="130" height="50" rx="8"/><text class="h" x="245" y="59">Kombi-Rechnung</text><text class="s" x="245" y="77">Leistung, 0–100</text></g>

<g class="mem"><rect x="35" y="132" width="130" height="50" rx="8"/><text class="h" x="100" y="149">Aktor-Params</text><text class="s" x="100" y="167">Lüfter, Poti</text></g>
<g class="mem"><rect x="180" y="132" width="130" height="50" rx="8"/><text class="h" x="245" y="149">Kombi-Params</text><text class="s" x="245" y="167">ecu, cluster</text></g>
