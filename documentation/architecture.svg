<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img">
<title>Architektur esp32VCU – Ebenenmodell</title>
<desc>Ebenen: Anwendung, Daten (params), Kommunikation (Codecs), Treiber, Hardware, extern; rechts Tasks und Dienste. Stand 2026-11-14 (VCU-DEC-002, -015, -019, -010).</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;dominant-baseline:central;text-anchor:middle}
.h{font-size:13px;font-weight:600}.s{font-size:11px}
.bl{font-size:12px;fill:#5F5E5A;text-anchor:start;font-weight:600}
.band{fill:#F7F6F2;stroke:#B4B2A9;stroke-width:0.8}
.ext rect{fill:#E1F5EE;stroke:#0F6E56}.ext .h{fill:#085041}.ext .s{fill:#0F6E56}
.mod rect{fill:#EEEDFE;stroke:#534AB7}.mod .h{fill:#3C3489}.mod .s{fill:#534AB7}
.task rect{fill:#E6F1FB;stroke:#185FA5}.task .h{fill:#0C447C}.task .s{fill:#185FA5}
.mem rect{fill:#FAEEDA;stroke:#854F0B}.mem .h{fill:#633806}.mem .s{fill:#854F0B}
.hw rect{fill:#F1EFE8;stroke:#5F5E5A}.hw .h{fill:#444441}.hw .s{fill:#5F5E5A}
.plan rect{fill:#FFFFFF;stroke:#5F5E5A;stroke-dasharray:4 3}.plan .h{fill:#444441}.plan .s{fill:#5F5E5A}
rect{stroke-width:0.8}
.a{stroke:#5F5E5A;stroke-width:1.4;fill:none}.d{stroke-dasharray:4 3}
.l{font-size:12px;fill:#444441;text-anchor:start}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="900" height="610" fill="#FFFFFF" stroke="none"/>

<!-- Bands -->
<rect class="band" x="20" y="20" width="620" height="80" rx="10"/><text class="bl" x="32" y="31">Anwendung</text>
<rect class="band" x="20" y="110" width="620" height="80" rx="10"/><text class="bl" x="32" y="121">Daten · params (Sperre params_lock)</text>
<rect class="band" x="20" y="200" width="620" height="80" rx="10"/><text class="bl" x="32" y="211">Kommunikation · Codecs</text>
<rect class="band" x="20" y="290" width="620" height="80" rx="10"/><text class="bl" x="32" y="301">Treiber</text>
<rect class="band" x="20" y="380" width="860" height="80" rx="10"/><text class="bl" x="32" y="391">Hardware · ESP32-S3</text>
<rect class="band" x="655" y="20" width="225" height="350" rx="10"/><text class="bl" x="667" y="31">Tasks und Dienste</text>

<!-- Application -->
<g class="mod"><rect x="35" y="42" width="140" height="50" rx="8"/><text class="h" x="105" y="59">Lüfterlogik</text><text class="s" x="105" y="77">Hand + Automatik</text></g>
<g class="mod"><rect x="190" y="42" width="140" height="50" rx="8"/><text class="h" x="260" y="59">Kombi-Rechnung</text><text class="s" x="260" y="77">Leistung, Temp., 0–100</text></g>
<g class="mod"><rect x="345" y="42" width="140" height="50" rx="8"/><text class="h" x="415" y="59">Heizung</text><text class="s" x="415" y="77">Anforderung (REQ-021)</text></g>

<!-- Data -->
<g class="mem"><rect x="35" y="132" width="140" height="50" rx="8"/><text class="h" x="105" y="149">fan, digipot</text><text class="s" x="105" y="167">Ausgänge</text></g>
<g class="mem"><rect x="190" y="132" width="140" height="50" rx="8"/><text class="h" x="260" y="149">ecu, cluster</text><text class="s" x="260" y="167">DME-Werte, Overrides</text></g>
<g class="mem"><rect x="345" y="132" width="140" height="50" rx="8"/><text class="h" x="415" y="149">vehicle, tesla_sdu</text><text class="s" x="415" y="167">+ Empfangszeit (stale)</text></g>
<g class="mem"><rect x="500" y="132" width="125" height="50" rx="8"/><text class="h" x="562" y="149">battery, heater, can</text><text class="s" x="562" y="167">BMS, Heizung, CAN-Status</text></g>

<!-- Codecs -->
<g class="mod"><rect x="35" y="222" width="140" height="50" rx="8"/><text class="h" x="105" y="239">986 Fahrzeug</text><text class="s" x="105" y="257">RX CAN1</text></g>
<g class="mod"><rect x="190" y="222" width="140" height="50" rx="8"/><text class="h" x="260" y="239">986 DME</text><text class="s" x="260" y="257">TX CAN1</text></g>
<g class="mod"><rect x="345" y="222" width="140" height="50" rx="8"/><text class="h" x="415" y="239">Tesla SDU</text><text class="s" x="415" y="257">RX CAN2</text></g>
<g class="mod"><rect x="500" y="222" width="125" height="50" rx="8"/><text class="h" x="562" y="239">Batterie</text><text class="s" x="562" y="257">RX CAN0, TX 0x43A</text></g>

<!-- Drivers -->
<g class="mod"><rect x="35" y="312" width="140" height="50" rx="8"/><text class="h" x="105" y="329">Lüfter, Poti, LED</text><text class="s" x="105" y="347">Poti abgeschaltet</text></g>
<g class="mod"><rect x="190" y="312" width="140" height="50" rx="8"/><text class="h" x="260" y="329">EEPROM</text><text class="s" x="260" y="347">AT24C, I2C</text></g>
<g class="mod"><rect x="345" y="312" width="280" height="50" rx="8"/><text class="h" x="485" y="329">CAN-Manager</text><text class="s" x="485" y="347">CAN0 ACAN_ESP32 · CAN1–3 ACAN2515 (Kern 1, Prio 24)</text></g>

<!-- Hardware -->
<g class="hw"><rect x="35" y="402" width="140" height="50" rx="8"/><text class="h" x="105" y="419">GPIO, X9C103S</text><text class="s" x="105" y="437">Relais, Poti, WS2812</text></g>
<g class="hw"><rect x="190" y="402" width="140" height="50" rx="8"/><text class="h" x="260" y="419">AT24C</text><text class="s" x="260" y="437">EEPROM</text></g>
<g class="hw"><rect x="345" y="402" width="125" height="50" rx="8"/><text class="h" x="407" y="419">TWAI</text><text class="s" x="407" y="437">CAN0, GPIO19/20</text></g>
<g class="hw"><rect x="485" y="402" width="140" height="50" rx="8"/><text class="h" x="555" y="419">3× MCP2515</text><text class="s" x="555" y="437">CAN1–3, SPI</text></g>
<g class="hw"><rect x="670" y="402" width="195" height="50" rx="8"/><text class="h" x="767" y="419">WLAN, CH343</text><text class="s" x="767" y="437">AP + STA · UART0 2 Mbaud</text></g>

<!-- External -->
<g class="ext"><rect x="35" y="482" width="140" height="50" rx="8"/><text class="h" x="105" y="499">Lüfter, Tankgeber</text><text class="s" x="105" y="517">Fahrzeug</text></g>
<g class="ext"><rect x="190" y="482" width="140" height="50" rx="8"/><text class="h" x="260" y="499">CAN0 Akku</text><text class="s" x="260" y="517">BMS, Zombie-Slave, DC/DC</text></g>
<g class="ext"><rect x="345" y="482" width="90" height="50" rx="8"/><text class="h" x="390" y="499">CAN1</text><text class="s" x="390" y="517">Porsche 986</text></g>
<g class="ext"><rect x="445" y="482" width="90" height="50" rx="8"/><text class="h" x="490" y="499">CAN2</text><text class="s" x="490" y="517">Tesla SDU</text></g>
<g class="ext"><rect x="545" y="482" width="80" height="50" rx="8"/><text class="h" x="585" y="499">CAN3</text><text class="s" x="585" y="517">Reserve</text></g>
<g class="ext"><rect x="670" y="482" width="195" height="50" rx="8"/><text class="h" x="767" y="499">Navi-Display, PC</text><text class="s" x="767" y="517">PWA · SavvyCAN, Terminal</text></g>

<!-- Tasks and services -->
<g class="task"><rect x="670" y="42" width="195" height="46" rx="8"/><text class="h" x="767" y="57">loop() · Kern 1</text><text class="s" x="767" y="75">Empfang 4 Busse, Ausgänge 100 ms</text></g>
<g class="task"><rect x="670" y="96" width="195" height="46" rx="8"/><text class="h" x="767" y="111">ecuTask · 6 ms · Kern 1</text><text class="s" x="767" y="129">Kombi rechnen, 1 DME-Frame</text></g>
<g class="task"><rect x="670" y="150" width="195" height="46" rx="8"/><text class="h" x="767" y="165">Web-Task · Kern 0</text><text class="s" x="767" y="183">/api, PWA (SPIFFS), /can, /io</text></g>
<g class="mod"><rect x="670" y="204" width="195" height="46" rx="8"/><text class="h" x="767" y="219">Signaltabelle, Persistenz</text><text class="s" x="767" y="237">API-Namen · EEPROM-Slots</text></g>
<g class="mod"><rect x="670" y="258" width="195" height="46" rx="8"/><text class="h" x="767" y="273">GVRET</text><text class="s" x="767" y="291">Bus 0–3 = CAN0–3, 4 = VCU-TX</text></g>
<g class="mod"><rect x="670" y="312" width="195" height="46" rx="8"/><text class="h" x="767" y="327">Log, Konsole</text><text class="s" x="767" y="345">[DIAG], Befehle auf UART0</text></g>

