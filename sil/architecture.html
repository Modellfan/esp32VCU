.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 8px 20px 24px; }
#stage { position: relative; min-width: 0; }
#edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
.grid { display: grid; grid-template-columns: 110px repeat(4, minmax(0, 1fr)) minmax(0, 1fr); gap: 8px; position: relative; }
.colhead { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 4px 2px; }
.lanelabel { background: var(--lane); border-radius: 10px 0 0 10px; padding: 10px; font-weight: 600; font-size: 13px; }
.lanelabel small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.cell { background: var(--lane); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 64px; }
.cell.last { border-radius: 0 10px 10px 0; }
.cell.svc { background: transparent; border-left: 2px dashed var(--line); }
.node { border: 1.5px solid; border-radius: 9px; padding: 7px 9px; cursor: pointer; text-align: left; font: inherit;
  width: 100%; position: relative; z-index: 2; transition: opacity .15s, box-shadow .15s; }
.node b { display: block; font-size: 13px; font-weight: 600; }
.node span { display: block; font-size: 11.5px; opacity: .85; line-height: 1.3; }
.node[data-kind=module] { background: var(--module); border-color: var(--module-b); color: var(--module-t); }
.node[data-kind=data] { background: var(--data); border-color: var(--data-b); color: var(--data-t); }
.node[data-kind=hardware] { background: var(--hw); border-color: var(--hw-b); color: var(--hw-t); }
.node[data-kind=external] { background: var(--ext); border-color: var(--ext-b); color: var(--ext-t); }
.node[data-kind=service] { background: var(--service); border-color: var(--service-b); color: var(--service-t); }
.node[data-status=geplant], .node[data-status=referenz] { border-style: dashed; }
.node::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; }
.node[data-status=umgesetzt]::after { background: var(--ok); }
.node[data-status=teilweise]::after { background: var(--warn); }
.node[data-status=geplant]::after, .node[data-status=referenz]::after { background: var(--plan); }
.node[data-status=offen]::after { background: var(--open); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.node.sel { box-shadow: 0 0 0 3px var(--accent); }
.node.hit { box-shadow: 0 0 0 2px var(--accent); }
.dim .node:not(.on) { opacity: .25; }
path.e { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: .55; }
path.e.control { stroke: var(--edge-ctl); stroke-dasharray: 2 4; }
path.e.planned { stroke-dasharray: 6 5; }
path.e.on { stroke: var(--edge-hi); opacity: 1; stroke-width: 2; }
path.e.control.on { stroke: var(--edge-ctl); }
.dim path.e:not(.on) { opacity: .08; }
text.el { font-size: 11px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; display: none; }
text.el.on { display: block; }
aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; align-self: start;
  position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
aside h2 { font-size: 17px; margin: 0 0 2px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
aside ul { margin: 0; padding-left: 18px; }
aside li { margin: 2px 0; }
aside code, aside a.file { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
aside a { color: var(--accent); }
.badge { display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); margin: 6px 4px 0 0; }
.tags span { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin: 2px 4px 2px 0; }
.rel button { border: 0; background: none; color: var(--accent); padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 20px 20px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; vertical-align: -2px; margin-right: 5px; }
.empty { color: var(--muted); }
@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; }
}
@media (max-width: 760px) {
  header, main, .legend { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: 1fr; }
  .colhead, #edges { display: none; }
  .lanelabel { border-radius: 10px 10px 0 0; margin-top: 8px; }
  .cell { border-radius: 0; min-height: 0; }
  .cell:empty { display: none; }
  .cell.svc { border-left: 0; background: var(--lane); }
  .toolbar input[type=search] { width: 100%; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="toolbar" role="toolbar" aria-label="Ansicht">
    <input type="search" id="search" placeholder="Suchen: Datei, REQ, Signal …" aria-label="Bausteine durchsuchen">
    <span id="lenses" style="display:contents"></span>
    <button class="chip" id="theme" aria-label="Hell/Dunkel umschalten">◐</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="edges" aria-hidden="true"></svg>
    <div class="grid" id="grid"></div>
  </div>
  <aside id="panel" aria-live="polite"><p class="empty">Baustein anklicken: Aufgabe, Dateien, Schnittstellen, Timing, Requirements, Entscheidungen, offene Punkte und Verbindungen.</p></aside>
</main>
<div class="legend">
  <span><i style="background:var(--module);border-color:var(--module-b)"></i>Modul</span>
  <span><i style="background:var(--data);border-color:var(--data-b)"></i>Daten (params)</span>
  <span><i style="background:var(--service);border-color:var(--service-b)"></i>Dienst</span>
  <span><i style="background:var(--hw);border-color:var(--hw-b)"></i>Hardware</span>
  <span><i style="background:var(--ext);border-color:var(--ext-b)"></i>extern</span>
  <span>● grün umgesetzt · ● gelb teilweise · ● grau geplant/Referenz · ● rot offen</span>
  <span>— Daten · ┄ Takt/Steuerung (blau) · - - geplant</span>
</div>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("arch-data").textContent);
  const nodes = new Map(data.nodes.map(n => [n.id, n]));
  const grid = document.getElementById("grid");
  const svg = document.getElementById("edges");
  const panel = document.getElementById("panel");
  const stage = document.getElementById("stage");
  const SVGNS = "http://www.w3.org/2000/svg";
  let selected = null;
  let lens = "all";

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));
  document.getElementById("title").textContent = data.meta.title;
  document.getElementById("subtitle").textContent = data.meta.subtitle;

  // ---- grid ----
  grid.appendChild(document.createElement("div"));
  data.meta.columns.forEach(c => {
    const h = document.createElement("div");
    h.className = "colhead";
    h.textContent = c;
    grid.appendChild(h);
  });
  const nodeEls = new Map();
  data.layers.forEach(layer => {
    const label = document.createElement("div");
    label.className = "lanelabel";
    label.innerHTML = esc(layer.title) + "<small>" + esc(layer.hint || "") + "</small>";
    grid.appendChild(label);
    for (let col = 1; col <= 5; col++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (col === 4 ? " last" : "") + (col === 5 ? " svc" : "");
      data.nodes.filter(n => n.layer === layer.id && n.col === col).forEach(n => {
        const b = document.createElement("button");
        b.className = "node";
        b.type = "button";
        b.dataset.id = n.id;
        b.dataset.kind = n.kind;
        b.dataset.status = n.status;
        b.title = n.status;
        b.innerHTML = "<b>" + esc(n.title) + "</b><span>" + esc(n.summary) + "</span>";
        b.addEventListener("click", () => select(n.id === selected ? null : n.id));
        cell.appendChild(b);
        nodeEls.set(n.id, b);
      });
      grid.appendChild(cell);
    }
  });

  // ---- edges ----
  const edgeEls = data.edges.map((e, i) => {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("class", "e " + e.kind);
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("class", "el");
    t.textContent = e.label || "";
    svg.appendChild(p);
    svg.appendChild(t);
    return {e, p, t, i};
  });

  function anchor(el, toward) {
    const r = el.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    const cx = r.left + r.width / 2 - s.left, cy = r.top + r.height / 2 - s.top;
    const dx = toward.x - cx, dy = toward.y - cy;
    if (Math.abs(dy) * r.width > Math.abs(dx) * r.height) {
      return {x: cx, y: dy > 0 ? r.bottom - s.top : r.top - s.top, v: true};
    }
    return {x: dx > 0 ? r.right - s.left : r.left - s.left, y: cy, v: false};
  }
  function center(el) {
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return {x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top};
  }
  function layoutEdges() {
    edgeEls.forEach(({e, p, t}) => {
      const a = nodeEls.get(e.from), b = nodeEls.get(e.to);
      if (!a || !b) return;
      const A = anchor(a, center(b)), B = anchor(b, center(a));
      const k = Math.max(30, Math.hypot(B.x - A.x, B.y - A.y) * 0.35);
      const c1 = A.v ? {x: A.x, y: A.y + Math.sign(B.y - A.y) * k} : {x: A.x + Math.sign(B.x - A.x) * k, y: A.y};
      const c2 = B.v ? {x: B.x, y: B.y + Math.sign(A.y - B.y) * k} : {x: B.x + Math.sign(A.x - B.x) * k, y: B.y};
      p.setAttribute("d", `M${A.x},${A.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${B.x},${B.y}`);
      t.setAttribute("x", (A.x + B.x) / 2 + 4);
      t.setAttribute("y", (A.y + B.y) / 2 - 4);
    });
  }

  // ---- lenses ----
  // Lenses: "Alle", the data set's own lenses (meta.lenses: {id, label, nodes[]}), "Offen / geplant".
  const lensNodes = {open: n => n.status !== "umgesetzt" || (n.details.open || []).length > 0};
  const lensDefs = [{id: "all", label: "Alle"}].concat(data.meta.lenses || [], [{id: "open", label: "Offen / geplant"}]);
  (data.meta.lenses || []).forEach(l => { const set = new Set(l.nodes); lensNodes[l.id] = n => set.has(n.id); });
  const lensBar = document.getElementById("lenses");
  lensDefs.forEach(l => {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.lens = l.id;
    b.textContent = l.label;
    b.setAttribute("aria-pressed", String(l.id === "all"));
    lensBar.appendChild(b);
  });

  function apply() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const on = new Set();
    let dim = false;
    if (selected) {
      dim = true;
      on.add(selected);
      data.edges.forEach(e => { if (e.from === selected) on.add(e.to); if (e.to === selected) on.add(e.from); });
    } else if (lens !== "all") {
      dim = true;
      data.nodes.filter(lensNodes[lens]).forEach(n => on.add(n.id));
    }
    nodeEls.forEach((el, id) => {
      el.classList.toggle("on", on.has(id));
      el.classList.toggle("sel", id === selected);
      const n = nodes.get(id);
      const hay = JSON.stringify(n).toLowerCase();
      el.classList.toggle("hit", q.length > 1 && hay.includes(q));
    });
    edgeEls.forEach(({e, p, t}) => {
      const active = selected ? (e.from === selected || e.to === selected) : (dim && on.has(e.from) && on.has(e.to));
      p.classList.toggle("on", active);
      t.classList.toggle("on", active && !!e.label);
    });
    stage.classList.toggle("dim", dim);
  }

  // ---- panel ----
  function list(title, items, fmt) {
    if (!items || !items.length) return "";
    return "<h3>" + title + "</h3><ul>" + items.map(fmt || (x => "<li>" + esc(x) + "</li>")).join("") + "</ul>";
  }
  function fileLink(f) {
    const clean = f.replace(/^lib: /, "");
    const href = /^(src|lib|pwa|documentation|sil)\//.test(clean) ? "../" + clean : null;
    return "<li>" + (href ? "<a class=\"file\" href=\"" + esc(href) + "\">" + esc(f) + "</a>" : "<code>" + esc(f) + "</code>") + "</li>";
  }
  function select(id) {
    selected = id;
    apply();
    if (!id) {
      panel.innerHTML = "<p class=\"empty\">Baustein anklicken: Aufgabe, Dateien, Schnittstellen, Timing, Requirements, Entscheidungen, offene Punkte und Verbindungen.</p>";
      return;
    }
    const n = nodes.get(id), d = n.details || {};
    const layer = data.layers.find(l => l.id === n.layer);
    const rel = (arr, dir) => arr.map(e => {
      const other = nodes.get(dir === "in" ? e.from : e.to);
      return "<li class=\"rel\"><button data-go=\"" + esc(other.id) + "\">" + esc(other.title) + "</button>" +
        (e.label ? " – " + esc(e.label) : "") + (e.kind !== "data" ? " <small>(" + esc(e.kind) + ")</small>" : "") + "</li>";
    }).join("");
    const incoming = data.edges.filter(e => e.to === id), outgoing = data.edges.filter(e => e.from === id);
    panel.innerHTML =
      "<h2>" + esc(n.title) + "</h2>" +
      "<span class=\"badge\">" + esc(layer ? layer.title : n.layer) + "</span>" +
      "<span class=\"badge\">" + esc(n.kind) + "</span>" +
      "<span class=\"badge\">" + esc(n.status) + "</span>" +
      "<p>" + esc(n.summary) + "</p>" +
      list("Aufgaben", d.responsibilities) +
      list("Dateien", d.files, fileLink) +
      list("Schnittstellen", d.interfaces) +
      (d.timing && d.timing !== "-" ? "<h3>Timing</h3><p>" + esc(d.timing) + "</p>" : "") +
      ((d.reqs || []).length || (d.decs || []).length ? "<h3>Requirements · Entscheidungen</h3><div class=\"tags\">" +
        (d.reqs || []).map(r => "<span>" + esc(r) + "</span>").join("") + (d.decs || []).map(r => "<span>" + esc(r) + "</span>").join("") + "</div>" : "") +
      list("Offen", d.open) +
      (incoming.length ? "<h3>Eingänge</h3><ul>" + rel(incoming, "in") + "</ul>" : "") +
      (outgoing.length ? "<h3>Ausgänge</h3><ul>" + rel(outgoing, "out") + "</ul>" : "");
    panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      select(b.dataset.go);
      nodeEls.get(b.dataset.go).focus({preventScroll: false});
    }));
  }

  // ---- controls ----
  document.querySelectorAll("[data-lens]").forEach(b => b.addEventListener("click", () => {
    lens = b.dataset.lens;
    document.querySelectorAll("[data-lens]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    selected = null;
    select(null);
  }));
  document.getElementById("search").addEventListener("input", apply);
  document.addEventListener("keydown", e => { if (e.key === "Escape") select(null); });
  const themeBtn = document.getElementById("theme");
  try { const t = localStorage.getItem("vcu-arch-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("vcu-arch-theme", document.documentElement.dataset.theme); } catch (_) {}
  });
  new ResizeObserver(layoutEdges).observe(stage);
  window.addEventListener("load", layoutEdges);
  layoutEdges();
  apply();
  const hash = decodeURIComponent(location.hash.slice(1));
  if (nodes.has(hash)) select(hash);
})();
</script>
</body>
</html>
